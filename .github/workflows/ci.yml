name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Weekly, to catch breakage from new releases of the packages the examples use.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    # Pinned: ubuntu-latest moved to 26.04, where `playwright install chromium`
    # fails ("Playwright does not support chromium on ubuntu26.04-x64").
    # Unpin once Playwright supports 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm exec eslint . --max-warnings=0
      - run: pnpm check-types
      - run: pnpm build
      - run: pnpm --filter @toolpath/example-typescript test
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @toolpath/example-react-viewer exec playwright install chromium
      # The build above produced the preview the suite serves.
      - run: pnpm --filter @toolpath/example-react-viewer exec playwright test

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.28
          python-version: '3.11'
      - run: uv run --locked --project python python -m compileall -q python/src
      - run: uv run --locked --project python python -I -c "import toolpath"
      - run: uvx --from ruff==0.16.2 ruff check python
